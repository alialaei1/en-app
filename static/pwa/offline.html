<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <title>Offline · Mimivo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071018;
        --surface: #122032;
        --text: #f1f6fb;
        --muted: #8fa3b8;
        --accent: #2ec4a0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(46, 196, 160, 0.18), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(94, 234, 212, 0.08), transparent 50%),
          var(--bg);
        color: var(--text);
      }
      .card {
        width: min(26rem, 100%);
        padding: 1.6rem 1.4rem;
        border-radius: 1.25rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        margin-bottom: 0.85rem;
        border-radius: 0.9rem;
        background: linear-gradient(145deg, #5eead4, #14967c);
        color: #04211c;
        font-family: Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0 0 0.45rem;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 1.1rem;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.15rem;
        background: var(--accent);
        color: #04211c;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">M</div>
      <h1>You’re offline</h1>
      <p>Mimivo needs a connection for this page. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
